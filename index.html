<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Narration Maker — watsonx Challenge 2026 · Japan ES Bob Challenge</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --border: #d1d5db;
      --text: #1f2328;
      --muted: #6b7280;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --playing: #10b981;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 18px; font-weight: 700; flex: 1; }
    header h1 span { color: var(--accent); }
    header h1 small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 10px; }

    .header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    select, button {
      font-family: inherit;
      font-size: 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      padding: 6px 12px;
      transition: background 0.15s, border-color 0.15s;
    }
    select:focus, button:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    select:hover { border-color: var(--accent); }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    button.danger {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger);
    }
    button.danger:hover { background: var(--danger); color: #fff; }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .slider-row input[type=range] {
      width: 72px;
      padding: 0;
      border: none;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .slider-val { min-width: 28px; text-align: right; }

    .voice-badge {
      font-size: 11px;
      background: #ddf4ff;
      color: #0550ae;
      border: 1px solid #93c5fd;
      border-radius: 20px;
      padding: 2px 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .voice-badge.female { background: #fce7f3; color: #9d174d; border-color: #f9a8d4; }
    .voice-badge.ja     { background: #f0fdf4; color: #166534; border-color: #86efac; }
    .voice-badge.unknown { background: #f7f8fa; color: #57606a; border-color: #d1d5db; }

    #browser-tip {
      display: none;
      background: #fff1f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      color: #991b1b;
      line-height: 1.6;
      margin: 0 24px 0;
    }
    #browser-tip strong { font-weight: 700; }
    #browser-tip a { color: #b91c1c; }

    main {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Single narration editor ── */
    .narration-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.15s;
    }
    .narration-card.playing {
      border-color: var(--playing);
      box-shadow: 0 0 0 3px rgba(16,185,129,.2);
    }

    .narration-card label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    #narration-textarea {
      font-family: inherit;
      font-size: 15px;
      line-height: 1.7;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      width: 100%;
      min-height: 320px;
      resize: vertical;
      transition: border-color 0.15s;
      color: var(--text);
    }
    #narration-textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-color: var(--accent);
    }

    /* ── Playback controls ── */
    .playback-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .btn-play-pause {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      padding: 0;
    }
    .btn-play-pause:hover { background: var(--accent-hover); transform: scale(1.05); }
    .btn-play-pause:focus { outline: 2px solid var(--accent); outline-offset: 3px; }
    .btn-play-pause svg { width: 20px; height: 20px; fill: #fff; }

    .btn-stop {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: transparent;
      color: var(--danger);
      border: 2px solid var(--danger);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      padding: 0;
    }
    .btn-stop:hover { background: var(--danger); color: #fff; }
    .btn-stop:focus { outline: 2px solid var(--danger); outline-offset: 3px; }
    .btn-stop svg { width: 16px; height: 16px; fill: currentColor; }

    .playback-status {
      flex: 1;
      font-size: 13px;
      color: var(--muted);
    }
    .playback-status.active { color: var(--playing); font-weight: 600; }
    .playback-status.paused { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>

<header>
  <h1>Narration <span>Maker</span><small>watsonx Challenge 2026 — Japan ES Bob Challenge</small></h1>
  <div class="header-controls">
    <label class="slider-row">
      Speed
      <input type="range" id="rate-slider" min="0.5" max="2" step="0.1" value="1" />
      <span class="slider-val" id="rate-val">1.0</span>
    </label>
    <label class="slider-row">
      Pitch
      <input type="range" id="pitch-slider" min="0.5" max="2" step="0.1" value="1" />
      <span class="slider-val" id="pitch-val">1.0</span>
    </label>
    <select id="voice-select" title="Voice"></select>
    <span class="voice-badge" id="voice-badge">detecting…</span>
  </div>
</header>

<div id="browser-tip">
  <strong>⚠ Microsoft Edge を推奨します。</strong>
  Firefox や Chrome では <code>Microsoft Keita Online / Guy Online / Christopher Online</code> などの高品質 Online 音声が利用できません。
  Edge で開いてください：
  <a href="#" id="open-in-edge-link">Edge で開く</a>
</div>

<main>
  <div class="narration-card" id="narration-card">
    <label for="narration-textarea">ナレーション テキスト（編集可能）</label>
    <textarea id="narration-textarea" spellcheck="false"></textarea>
  </div>

  <div class="playback-bar">
    <button class="btn-play-pause" id="btn-play-pause" title="再生 / 一時停止">
      <!-- play icon -->
      <svg id="icon-play"  viewBox="0 0 20 24"><polygon points="0,0 20,12 0,24"/></svg>
      <!-- pause icon (hidden) -->
      <svg id="icon-pause" viewBox="0 0 20 24" style="display:none"><rect x="0" y="0" width="7" height="24"/><rect x="13" y="0" width="7" height="24"/></svg>
    </button>
    <button class="btn-stop" id="btn-stop" title="停止">
      <svg viewBox="0 0 16 16"><rect x="0" y="0" width="16" height="16"/></svg>
    </button>
    <span class="playback-status" id="playback-status">テキストを入力して ▶ を押してください</span>
  </div>
</main>

<script>
(function () {
  const STORAGE_KEY = 'narration_tiles_wx2026_challenge_v1';
  let voices = [];
  // playback state: 'stopped' | 'playing' | 'paused'
  let state = 'stopped';

  const synth = window.speechSynthesis;

  /* ── Voice detection helpers ── */
  const MALE_NAMES_EN = /david|mark|guy|aaron|fred|tom\b|paul|james|eric|oliver|reed|ryan|arthur|eddy|rishi|bruce|george|ken\b|alex|daniel|thomas|stefan|luca|jorge|carlos|diego|pablo|junior|superstar|richard|christopher|andrew|william|peter|john|tony/i;
  const MALE_NAMES_JA = /keita|ichiro|male|man\b/i;
  const FEMALE_NAMES  = /zira|samantha|victoria|karen|moira|veena|fiona|tessa|nora|sara\b|anna\b|amelie|alice|ioana|luciana|isabella|joana|laura|paulina|lekha|sin-ji|mei-jia|ting-ting|lily|yuri|kyoko|haruka|mizuki|kate\b|susan|linda|emily|jennifer|julie|claire|lea\b|nathalie|hazel|heather|natasha|cortana|ayumi|nanami/i;
  const EN_US_LANG    = /^en[-_](US|us)/;
  const EN_LANG       = /^en/;
  const JA_LANG       = /^ja/;

  function isMaleJA(v) { return JA_LANG.test(v.lang) && MALE_NAMES_JA.test(v.name) && !FEMALE_NAMES.test(v.name); }
  function isMaleEN(v) { return EN_LANG.test(v.lang) && MALE_NAMES_EN.test(v.name) && !FEMALE_NAMES.test(v.name); }
  function isMale(v)   { return isMaleJA(v) || isMaleEN(v); }
  function isFemale(v) { return FEMALE_NAMES.test(v.name); }

  function genderLabel(v) {
    if (JA_LANG.test(v.lang)) {
      if (isMaleJA(v)) return ' ♂';
      if (isFemale(v)) return ' ♀';
      return '';
    }
    if (isMaleEN(v)) return ' ♂';
    if (isFemale(v)) return ' ♀';
    return '';
  }

  function updateBadge(v) {
    const badge = document.getElementById('voice-badge');
    badge.className = 'voice-badge';
    if (JA_LANG.test(v.lang)) {
      badge.classList.add('ja');
      const gender = isMaleJA(v) ? '♂' : (isFemale(v) ? '♀' : '?');
      badge.textContent = gender + ' ' + v.name + ' (' + v.lang + ')';
    } else if (isMaleEN(v)) {
      badge.textContent = '♂ ' + v.name + ' (' + v.lang + ')';
    } else if (isFemale(v)) {
      badge.classList.add('female');
      badge.textContent = '♀ ' + v.name + ' (' + v.lang + ')';
    } else {
      badge.classList.add('unknown');
      badge.textContent = '? ' + v.name + ' (' + v.lang + ')';
    }
  }

  function loadVoices() {
    voices = synth.getVoices();
    if (voices.length === 0) return;

    const sel = document.getElementById('voice-select');
    sel.innerHTML = '';

    const groups = {
      jaJP:  { label: '🇯🇵 日本語 (Japanese)', voices: [] },
      enUS:  { label: '🇺🇸 English (US)',       voices: [] },
      enOth: { label: '🇬🇧 English (Other)',    voices: [] },
      other: { label: '🌐 Other',               voices: [] },
    };

    voices.forEach((v, i) => {
      if (!/natural/i.test(v.name)) return;   // Natural 音声のみ表示
      const entry = { v, i };
      if (JA_LANG.test(v.lang))          groups.jaJP.voices.push(entry);
      else if (EN_US_LANG.test(v.lang))  groups.enUS.voices.push(entry);
      else if (EN_LANG.test(v.lang))     groups.enOth.voices.push(entry);
      else                               groups.other.voices.push(entry);
    });

    ['jaJP', 'enUS', 'enOth', 'other'].forEach(key => {
      const g = groups[key];
      if (g.voices.length === 0) return;
      const grp = document.createElement('optgroup');
      grp.label = g.label;
      g.voices.forEach(({ v, i }) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = v.name + genderLabel(v) + ' (' + v.lang + ')';
        grp.appendChild(opt);
      });
      sel.appendChild(grp);
    });

    /* ── Auto-select best Natural voice ──
       Priority:
       P1: Male Japanese Natural (Keita Online Natural)
       P2: Any Japanese Natural (non-female first)
       P3: Any Japanese Natural
       P4: Named male en-US Natural
       P5: Named male any English Natural
       P6: Any en-US Natural non-female
       P7: Any en-US Natural
       P8: Any Natural voice
    ── */
    const isNatural = v => /natural/i.test(v.name);
    let pick = voices.findIndex(v => isNatural(v) && isMaleJA(v));
    if (pick === -1) pick = voices.findIndex(v => isNatural(v) && JA_LANG.test(v.lang) && !isFemale(v));
    if (pick === -1) pick = voices.findIndex(v => isNatural(v) && JA_LANG.test(v.lang));
    if (pick === -1) pick = voices.findIndex(v => isNatural(v) && EN_US_LANG.test(v.lang) && isMaleEN(v));
    if (pick === -1) pick = voices.findIndex(v => isNatural(v) && EN_LANG.test(v.lang) && isMaleEN(v));
    if (pick === -1) pick = voices.findIndex(v => isNatural(v) && EN_US_LANG.test(v.lang) && !isFemale(v));
    if (pick === -1) pick = voices.findIndex(v => isNatural(v) && EN_US_LANG.test(v.lang));
    if (pick === -1) pick = voices.findIndex(v => isNatural(v));
    if (pick === -1 && voices.length > 0) pick = 0;

    if (pick !== -1) {
      sel.value = pick;
      updateBadge(voices[pick]);
    }
  }

  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  loadVoices();

  /* ── Browser tip ── */
  (function () {
    const isEdge = /Edg\//.test(navigator.userAgent);
    if (!isEdge) {
      document.getElementById('browser-tip').style.display = 'block';
      document.getElementById('open-in-edge-link').href = 'microsoft-edge:' + location.href;
    }
  })();

  document.getElementById('voice-select').addEventListener('change', e => {
    const idx = parseInt(e.target.value);
    if (voices[idx]) updateBadge(voices[idx]);
  });

  document.getElementById('rate-slider').addEventListener('input', e => {
    document.getElementById('rate-val').textContent = parseFloat(e.target.value).toFixed(1);
  });
  document.getElementById('pitch-slider').addEventListener('input', e => {
    document.getElementById('pitch-val').textContent = parseFloat(e.target.value).toFixed(1);
  });

  /* ── Playback ── */
  function setStatus(s, msg) {
    state = s;
    const statusEl = document.getElementById('playback-status');
    const card     = document.getElementById('narration-card');
    const iconPlay  = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');

    statusEl.className = 'playback-status';
    card.classList.remove('playing');

    if (s === 'playing') {
      statusEl.classList.add('active');
      statusEl.textContent = msg || '▶ 再生中…';
      card.classList.add('playing');
      iconPlay.style.display  = 'none';
      iconPause.style.display = '';
    } else if (s === 'paused') {
      statusEl.classList.add('paused');
      statusEl.textContent = msg || '⏸ 一時停止中';
      iconPlay.style.display  = '';
      iconPause.style.display = 'none';
    } else {
      statusEl.textContent = msg || '停止しました';
      iconPlay.style.display  = '';
      iconPause.style.display = 'none';
    }
  }

  function startSpeech() {
    const text = document.getElementById('narration-textarea').value.trim();
    if (!text) {
      setStatus('stopped', 'テキストを入力してください');
      return;
    }
    synth.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const voiceIdx = parseInt(document.getElementById('voice-select').value);
    if (voices[voiceIdx]) utter.voice = voices[voiceIdx];
    utter.rate  = parseFloat(document.getElementById('rate-slider').value);
    utter.pitch = parseFloat(document.getElementById('pitch-slider').value);
    utter.onend   = () => setStatus('stopped', '再生完了');
    utter.onerror = () => setStatus('stopped', 'エラーが発生しました');
    synth.speak(utter);
    setStatus('playing');
  }

  document.getElementById('btn-play-pause').addEventListener('click', () => {
    if (state === 'stopped') {
      startSpeech();
    } else if (state === 'playing') {
      synth.pause();
      setStatus('paused');
    } else if (state === 'paused') {
      synth.resume();
      setStatus('playing');
    }
  });

  document.getElementById('btn-stop').addEventListener('click', () => {
    synth.cancel();
    setStatus('stopped', '停止しました');
  });

  /* Space key: toggle play/pause (but not when textarea is focused) */
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') {
      e.preventDefault();
      document.getElementById('btn-play-pause').click();
    }
    if (e.key === 'Escape') {
      document.getElementById('btn-stop').click();
    }
  });

  /* ── Load / Init ── */
  function loadText() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(saved) && saved.length > 0) {
        // Migrate old tile format → join into one text
        return saved.map(t => (t.label ? '【' + t.label + '】\n' : '') + t.text).join('\n\n');
      }
    } catch { /* ignore */ }
    return null;
  }

  function saveText(text) {
    // Store as single-tile array to stay compatible with the storage key
    const data = [{ id: 'single', label: '', text: text }];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  const textarea = document.getElementById('narration-textarea');

  // Autosave on input
  textarea.addEventListener('input', () => saveText(textarea.value));

  const existing = loadText();
  if (existing) {
    textarea.value = existing;
  } else {
    // Default example text
    textarea.value = "This is a pen. That is a pencil.";
    saveText(textarea.value);
  }

  setStatus('stopped', 'テキストを入力して ▶ を押してください');
})();
</script>
</body>
</html>
